<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyLessonPlan File Manager</title>
    <link rel="stylesheet" href="/static/easylesson.css">
</head>
<body>
    <div class="container">
        <div class="left-panel">
            <div class="explorer-header">EasyLessonPlan Explorer</div>
            <div id="file-tree" class="file-tree">
                <!-- File tree will be loaded here by JavaScript -->
            </div>
        </div>
        <div class="splitter"></div>
        <div class="right-panel">
            <div class="action-area">
                <h2>Actions</h2>

                <!-- File Upload Section -->
                <div class="action-section">
                    <h3>Upload File</h3>
                    <div class="upload-area" id="file-drop-zone">
                        Drag & Drop File Here or
                        <input type="file" id="file-input" class="hidden-file-input">
                        <button class="btn" onclick="document.getElementById('file-input').click()">Browse & Upload File</button>
                    </div>
                    <div id="selected-file-info" class="selected-info"></div>
                    <button class="btn btn-primary" id="upload-file-btn" disabled>Upload Selected File</button>
                </div>

                <!-- Folder Upload Section -->
                <div class="action-section">
                    <h3>Upload Folder</h3>
                    <input type="file" id="folder-input" webkitdirectory directory multiple class="hidden-file-input">
                    <button class="btn" onclick="document.getElementById('folder-input').click()">Browse & Upload Folder</button>
                    <div id="selected-folder-info" class="selected-info"></div>
                    <button class="btn btn-primary" id="upload-folder-btn" disabled>Upload Selected Folder</button>
                </div>

                <!-- Create Folder Section -->
                <div class="action-section">
                    <h3>Create New Folder</h3>
                    <input type="text" id="new-folder-name" placeholder="New folder name">
                    <select id="parent-folder-select"></select>
                    <button class="btn btn-primary" id="create-folder-btn">Create Folder</button>
                </div>
            </div>

            <div class="status-area">
                <h2>Status</h2>
                <div id="status-messages">
                    <!-- Status messages will appear here -->
                </div>
            </div>
        </div>
    </div>

    <script src="/static/easylesson.js"></script>
</body>
</html>
