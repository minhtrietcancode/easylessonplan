<!-- frontend\templates\easylesson.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyLesson - AI-Powered Lesson Planning</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/pages/easylesson/easylesson.css">
</head>
<body>
    <nav class="easylesson-navbar">
        <div class="navbar-content">
            <a href="/" class="navbar-logo">EasyLesson</a>
            <div class="navbar-user-info">
                {% if user %}
                    <span class="navbar-welcome-message">Signed in as {{ user.name.split(' ')[0] }}</span>
                    <a href="{{ url_for('auth.logout') }}" class="navbar-logout-button">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </a>
                {% endif %}
            </div>
        </div>
    </nav>
    <div class="easylesson-container" id="mainContainer">
        <!-- Left Column - File Upload Section -->
        <div class="column left-column" id="leftColumn">
            <div class="column-content">
                <!-- <h2 class="column-header">EasyLesson</h2> -->
                <div class="upload-section">
                    <!-- File upload area can be expanded here -->
                </div>
            </div>
            
            <button class="upload-button" id="uploadButton" data-action="upload-file">
                <i class="fas fa-upload"></i>
                Upload File
            </button>
            
            <div class="resizer" data-resize="left"></div>
        </div>

        <!-- Middle Column - File Display Area -->
        <div class="column middle-column" id="middleColumn">
            <div class="file-display-area" id="fileDisplayArea">
                <div class="placeholder-text">
                    <i class="fas fa-file-alt" style="font-size: 2rem; margin-bottom: 16px; color: #cbd5e0;"></i>
                    <p>File content will appear here...</p>
                </div>
            </div>
            <div class="resizer" data-resize="right"></div>
        </div>

        <!-- Right Column - AI Chat Interface -->
        <div class="column right-column" id="rightColumn">
            <!-- Chat Header -->
            <div class="chat-header">
                <h2 class="chat-title">AI Lesson Assistant</h2>
            </div>

            <!-- Main Chat Container -->
            <div class="chat-container" id="chatContainer">
                <!-- Messages Area -->
                <div class="messages-area" id="messagesArea">
                    <div class="message ai-message" data-message-type="ai">
                        <i class="fas fa-robot"></i>
                        <span class="message-content">Hello! I'm your AI lesson assistant. How can I help you create amazing lessons today?</span>
                    </div>
                </div>

                <!-- Input Area -->
                <div class="input-area" id="inputArea">
                    <textarea 
                        id="messageInput"
                        class="message-input" 
                        placeholder="Type your message here... Press Enter to send!"
                        rows="1"
                        data-action="chat-input"></textarea>
                    
                    <div class="input-bottom">
                        <div class="model-tag" id="modelIndicator">
                            <i class="fas fa-brain"></i>
                            <span id="modelName">GPT-4</span>
                        </div>
                        <button class="send-btn" id="sendButton" data-action="send-message">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Base Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lodash.js/4.17.21/lodash.min.js"></script>
    
    <!-- API Scripts - Load in correct order -->
    <script src="/static/api/config/routes.js"></script>
    <script type="module" src="/static/api/init.js"></script>
    
    <!-- Main Application (no backend API integration) -->
    <script src="/static/pages/easylesson/easylesson.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const navbar = document.querySelector('.easylesson-navbar');
            if (navbar) {
                const navbarHeight = navbar.offsetHeight;
                document.documentElement.style.setProperty('--navbar-height', `${navbarHeight}px`);
            }
        });
    </script>
</body>
</html>
